<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
<link type="text/css" href="css/style.css" rel="stylesheet">
</head>
<body onload="init();">
    <table class="calculadora has-background-current">
        <tr>
            <td colspan="4"><span id="resultado"></span></td>
        </tr>
        <tr>
            <td><button id="on" class="button is-warning is-dark">on</button></td>
            <td><button id="sin" class="button is-warning is-dark">sin</button></td>
            <td><button id="cos" class="button is-warning is-dark">cos</button></td>
            <td><button id="tan" class="button is-warning is-dark">tan</button></td>
            
        </tr>
        <tr>
            <td><button id="log" class="button is-warning is-dark">log</button></td>
            <td><button id="ln" class="button is-warning is-dark">ln</button></td>
            <td><button id="pi" class="button is-warning is-dark">π</button></td>
            <td><button id="e" class="button is-warning is-dark">e</button></td>
        </tr>
        <tr>
            <td><button id="sqrt" class="button is-warning is-dark">√</button></td>
            <td><button id="parentesis" class="button is-warning is-dark">(</button></td>
            <td><button id="parentesis2" class="button is-warning is-dark">)</button></td>
            <td><button id="division" class="button is-danger is-dark">/</button></td>
            
        </tr>
        <tr>
            <td><button id="nueve" class="button is-primary is-dark">9</button></td>
            <td><button id="ocho" class="button is-primary is-dark">8</button></td>
            <td><button id="siete" class="button is-primary is-dark">7</button></td>
            <td><button id="multiplicacion" class="button is-danger is-dark">*</button></td>
            
        </tr>
        <tr>
            <td><button id="seis" class="button is-primary is-dark">6</button></td>
            <td><button id="cinco" class="button is-primary is-dark">5</button></td>
            <td><button id="cuatro" class="button is-primary is-dark">4</button></td>
            <td><button id="resta" class="button is-danger is-dark">-</button></td>
            
        </tr>
        <tr>
            <td><button id="tres" class="button is-primary is-dark">3</button></td>
            <td><button id="dos" class="button is-primary is-dark">2</button></td>
            <td><button id="uno" class="button is-primary is-dark">1</button></td>
            <td><button id="suma" class="button is-danger is-dark">+</button></td>
            
        </tr>
        <tr>
            <td><button id="punto" class="button is-primary is-dark">.</button></td>
            <td><button id="cero" class="button is-primary is-dark">0</button></td>
            <td><button id="reset" class="button is-danger is-dark">C</button></td>
            <td><button id="igual" class="button is-danger is-dark">=</button></td>
        </tr>
       
    </table>
<script src="js/js.js"></script>
</body>
</html>
